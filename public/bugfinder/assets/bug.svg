<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e60d5"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antenna Left -->
  <path d="M42 28 C36 18 28 15 22 14" stroke="#1e60d5" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="14" r="3.5" fill="#38bdf8"/>

  <!-- Antenna Right -->
  <path d="M58 28 C64 18 72 15 78 14" stroke="#1e60d5" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="78" cy="14" r="3.5" fill="#38bdf8"/>

  <!-- Front Legs -->
  <path d="M33 42 C18 38 12 30 8 26" stroke="#1e60d5" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M67 42 C82 38 88 30 92 26" stroke="#1e60d5" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Middle Legs -->
  <path d="M30 54 C14 54 8 52 4 52" stroke="#1e60d5" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M70 54 C86 54 92 52 96 52" stroke="#1e60d5" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Rear Legs -->
  <path d="M33 68 C18 72 12 80 8 86" stroke="#1e60d5" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M67 68 C82 72 88 80 92 86" stroke="#1e60d5" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <ellipse cx="50" cy="30" rx="14" ry="11" fill="url(#bugGrad)"/>
  <!-- Eyes -->
  <circle cx="43" cy="27" r="3" fill="#38bdf8"/>
  <circle cx="57" cy="27" r="3" fill="#38bdf8"/>

  <!-- Main Body / Shell -->
  <path d="M32 40 C32 36 68 36 68 40 C75 52 74 72 65 82 C58 89 42 89 35 82 C26 72 25 52 32 40 Z" fill="url(#bugGrad)"/>
  
  <!-- Shell Seam / Cybernetic Stripe -->
  <line x1="50" y1="40" x2="50" y2="85" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="36" y1="58" x2="64" y2="58" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
