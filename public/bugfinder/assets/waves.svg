      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="50%" stop-color="#e8f2fe"/>
      <stop offset="100%" stop-color="#dfeeff"/>
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1"/>
